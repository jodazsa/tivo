# stations.yaml — Radio station definitions (flat list)
#
# Station types:
#   stream    — Internet radio (requires url)
#   file      — Single local audio file, loops (requires path, relative to /home/pi/audio/)
#   dir       — All audio files in a directory (requires path, relative to /home/radio/audio/)
#   file_once — Single local audio file from start, then stop (requires path)
#
# The station knob (BCD switch, positions 0-9) indexes into this list.
# Position wraps around using modulo, so a 10-position switch cycles
# through the first 10 stations. Reorder or trim this list to choose
# which stations are accessible from the knob.
#
# Example:
# stations:
#   - name: "WWOZ New Orleans"
#     type: stream
#     url: "http://wwoz-sc.streamguys1.com/wwoz-hi.mp3"
#   - name: "Bob Dylan"
#     type: dir
#     path: "shows/BobDylan"
#   - name: "Rain Sounds"
#     type: file
#     path: "ambient/rain.mp3"
#
# Available types:
#   stream:    just play the stream
#   file:      play one audio file, seek to a random position, loop forever
#   dir:       choose one item randomly from the listed directory, then continue
#              playing items in order, looping at end
#   file_once: play one audio file from the beginning exactly once, then stop

